services:
  db:
    image: postgres:17-alpine
    container_name: beamos-db
    environment:
      POSTGRES_DB: beamos
      POSTGRES_USER: beamos
      POSTGRES_PASSWORD: beamos
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    image: oven/bun:1
    container_name: beamos-api
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      BEAMOS_API_ADDITIONAL_PLUGINS_MODULE: ${BEAMOS_API_ADDITIONAL_PLUGINS_MODULE:-../../../../../enterprise/api/src/plugins/additional-plugins.js}
      DB_URI: postgresql://beamos:beamos@db:5432/beamos
      PORT: ${PORT:-3001}
    command: >
      sh -lc "bun install && bun --env-file=.env run --cwd beamos/apps/api dev"
    ports:
      - "${PORT:-3001}:3001"
    volumes:
      - .:/app
      - bun_node_modules:/app/node_modules

  web:
    image: oven/bun:1
    container_name: beamos-web
    working_dir: /app
    depends_on:
      api:
        condition: service_started
    environment:
      BEAMOS_WEB_ADDITIONAL_PLUGINS_MODULE: ${BEAMOS_WEB_ADDITIONAL_PLUGINS_MODULE:-../../../enterprise/web/src/plugins/additional-plugins.ts}
      VITE_API_PROXY_TARGET: http://api:3001
    command: >
      sh -lc "bun install && bun run --cwd beamos/apps/web dev --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - bun_node_modules:/app/node_modules

volumes:
  postgres_data:
  bun_node_modules:
