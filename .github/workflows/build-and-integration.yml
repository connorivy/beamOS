name: Build and Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-integration:
    runs-on: ubuntu-latest
    env:
      BEAMOS_WEB_ADDITIONAL_PLUGINS_MODULE: ./src/plugins/additional-plugins.ts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project and regenerate API client
        run: bun run build

      - name: Ensure generated files are committed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Repository has uncommitted changes after build. Run 'bun run build' and commit the results."
            git --no-pager status --short
            git --no-pager diff
            exit 1
          fi

      - name: Run integration tests
        run: bun run test:integration
